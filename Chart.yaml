apiVersion: v2
name: convoy
description: Open Source Webhooks Gateway
type: application
version: "3.7.12"
appVersion: "v26.7.6"
keywords:
  - Webhooks
  - Kubernetes
  - Convoy
  - Gateway
maintainers:
  - name: Convoy Engineering Team
    email: engineering@getconvoy.io
    url: https://getconvoy.io
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Bump default Convoy image to v26.7.6
    - kind: changed
      description: Split retention period/enabled from webhook archiving env knobs
    - kind: added
      description: Add server SMTP env knobs on the server chart
dependencies:
  - name: postgresql
    version: 12.5.6
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  - name: redis
    version: 17.11.3
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled

  # Vendored subcharts under charts/agent and charts/server (see charts/ directory).
  - name: agent
    version: 3.7.12
    repository: ""
    condition: agent.enabled

  - name: server
    version: 3.7.12
    repository: ""
    condition: server.enabled
