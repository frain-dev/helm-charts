apiVersion: v2
name: convoy
description: Open Source Webhooks Gateway
type: application
version: "3.7.11"
appVersion: "v26.7.3"
keywords:
  - Webhooks
  - Kubernetes
  - Convoy
  - Gateway
maintainers:
  - name: Convoy Engineering Team
    email: engineering@getconvoy.io
    url: https://getconvoy.io
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Bump default Convoy image to v26.7.3
    - kind: added
      description: global.convoy.queue_provider selects the Redis or Postgres queue, with postgresQueue tuning values
    - kind: fixed
      description: Render the dispatcher deny list as CONVOY_DISPATCHER_BLOCK_LIST, the name Convoy reads
    - kind: fixed
      description: Render global.convoy.read_replica_dsn as CONVOY_DB_READ_REPLICAS, the name and shape Convoy reads
dependencies:
  - name: postgresql
    version: 12.5.6
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  - name: redis
    version: 17.11.3
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled

  # Vendored subcharts under charts/agent and charts/server (see charts/ directory).
  - name: agent
    version: 3.7.11
    repository: ""
    condition: agent.enabled

  - name: server
    version: 3.7.11
    repository: ""
    condition: server.enabled
